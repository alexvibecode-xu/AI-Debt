name: Refresh data and publish

on:
  schedule:
    - cron: "0 12 * * 1-5"   # 12:00 UTC on weekdays (8am New York)
  workflow_dispatch:         # lets you press "Run workflow" by hand
  push:
    branches: [main]         # republish whenever files change

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scrape amcompute and ccir.io
        run: python scrape.py
        working-directory: public
      - name: Commit the new data
        run: |
          git config user.name "tracker-bot"
          git config user.email "tracker-bot@users.noreply.github.com"
          git add public/data
          git commit -m "Refresh data $(date -u +%Y-%m-%d)" || echo "no changes"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deploy
        uses: actions/deploy-pages@v4
